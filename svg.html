  body{

  @keyframes animStar {

}

#smallstarsContainer {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    animation: animStar 120s linear infinite;
}

#largestarsContainer {

    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    animation: animStar 240s linear infinite
}
